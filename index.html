function speak(text,lang){if(!('speechSynthesis' in window)){alert('当前浏览器不支持语音合成，请使用 Chrome、Edge 或 Safari。');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang=lang==='de'?'de-DE':'en-US';u.rate=Number($('speed').value);u.pitch=1;let voices=speechSynthesis.getVoices();let voice=voices.find(v=>v.lang.toLowerCase()===(lang==='de'?'de-de':'en-us'))||voices.find(v=>v.lang.toLowerCase().startsWith(lang));if(voice)u.voice=voice;speechSynthesis.speak(u)}
function speaker(text,lang){let b=make('button','speak','🔊');b.type='button';b.title='点击朗读';b.setAttribute('aria-label','朗读 '+text);b.addEventListener('click',()=>speak(text,lang));return b}
function render(){let list=filtered(),pages=Math.max(1,Math.ceil(list.length/25));page=Math.min(page,pages-1);let subset=list.slice(page*25,(page+1)*25),tbody=$('tbody');tbody.replaceChildren();for(let w of subset){let k=key(w),yes=known.has(k),tr=make('tr'),left=make('td'),mid=make('td'),right=make('td');let term=make('span','word',w.word);left.append(term,speaker(w.word,w.lang),make('div','lang',w.lang==='de'?'DE · B2–C1':'EN · TOEFL'));if(w.lang==='de'){let ex=make('div','example',w.example);ex.append(speaker(w.example,'de'));left.append(ex)}mid.style.textAlign='center';let check=make('input','check');check.type='checkbox';check.checked=yes;check.setAttribute('aria-label','已掌握 '+w.word);check.addEventListener('change',()=>{if(check.checked){known.add(k);revealed.add(k)}else{known.delete(k);revealed.delete(k)}try{localStorage.setItem('vocab_de_en_v4',JSON.stringify(Object.fromEntries([...known].map(x=>[x,true]))))}catch(e){}render()});mid.append(check);let ans=make('button','answer'+(yes||revealed.has(k)?'':' hidden'));ans.append(make('span','',w.meaning));ans.title='点击揭开或重新遮盖释义';ans.addEventListener('click',()=>{if(revealed.has(k))revealed.delete(k);else revealed.add(k);render()});right.append(ans);if(yes&&w.lang==='en'){let [coll,sentence]=enDetails(w),extra=make('div','extras');extra.append(make('strong','','搭配 / 学术用法'),make('div','',coll),make('strong','','英语例句 / 用法提示'),make('div','',sentence),speaker(sentence,'en'));right.append(extra)}tr.append(left,mid,right);tbody.append(tr)}$('stats').textContent=`去重词汇 ${WORDS.length} 个 · 当前筛选 ${list.length} 个 · 已掌握 ${known.size} 个（${Math.round(known.size/WORDS.length*100)}%）`;$('fill').style.width=known.size/WORDS.length*100+'%';$('pages').textContent=`第 ${page+1} / ${pages} 页 · 每页 25 个`;$('prev').disabled=page===0;$('next').disabled=page===pages-1}
for(let id of ['lang','status'])$(id).addEventListener('change',()=>{page=0;render()});$('search').addEventListener('input',()=>{page=0;render()});$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('hide').onclick=()=>{revealed.clear();render()};$('show').onclick=()=>{filtered().slice(page*25,(page+1)*25).forEach(w=>revealed.add(key(w)));render()};$('shuffle').onclick=()=>{for(let i=WORDS.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[WORDS[i],WORDS[j]]=[WORDS[j],WORDS[i]]}page=0;render()};$('import').onclick=()=>$('import-file').click();
$('import-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{let raw=await file.text(),lines=raw.replace(/^\uFEFF/,'').trim().split(/\r?\n/);function cells(line){let out=[],cur='',quoted=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'){if(quoted&&line[i+1]==='"'){cur+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){out.push(cur);cur=''}else cur+=c}out.push(cur);return out}let headers=cells(lines.shift()),li=headers.indexOf('语言'),wi=headers.indexOf('单词'),ki=headers.indexOf('已掌握');if(li<0||wi<0||ki<0)throw Error('CSV 缺少语言、单词或已掌握列');let added=0;for(let line of lines){if(!line.trim())continue;let r=cells(line),k=r[li]+':'+(r[wi]||'').trim().toLowerCase();if((r[ki]||'').trim()==='是'&&!known.has(k)){known.add(k);added++}}localStorage.setItem('vocab_de_en_v4',JSON.stringify(Object.fromEntries([...known].map(x=>[x,true]))));render();alert('导入完成，新增恢复 '+added+' 个已掌握词条。');}catch(err){alert('导入失败：'+err.message)}e.target.value=''});
$('stop').onclick=()=>speechSynthesis.cancel();$('export').onclick=()=>{let csv='\ufeff语言,单词,中文释义,已掌握\n'+WORDS.map(w=>[w.lang,w.word,w.meaning,known.has(key(w))?'是':'否'].map(s=>'"'+String(s).replaceAll('"','""')+'"').join(',')).join('\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='英德词汇掌握进度.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};render();
</script></body></html>
